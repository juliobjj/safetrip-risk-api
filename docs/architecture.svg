<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura da Risk Analysis API</title>
  <desc id="desc">A SafeTrip API envia dados à Risk Analysis API, que calcula e persiste o resultado no SQLite.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#244a78"/></marker><style>.b{fill:#eef5ff;stroke:#244a78;stroke-width:2}.d{fill:#fff4dd;stroke:#9a6815;stroke-width:2}.t{font:600 20px Arial;fill:#162a43}.s{font:15px Arial;fill:#334e68}.l{stroke:#244a78;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect class="b" x="35" y="95" rx="12" width="210" height="100"/><text class="t" x="140" y="135" text-anchor="middle">SafeTrip API</text><text class="s" x="140" y="165" text-anchor="middle">Cliente REST</text>
  <rect class="b" x="345" y="70" rx="12" width="250" height="150"/><text class="t" x="470" y="112" text-anchor="middle">Risk Analysis API</text><text class="s" x="470" y="143" text-anchor="middle">FastAPI :8000</text><text class="s" x="470" y="170" text-anchor="middle">Regras de score</text><text class="s" x="470" y="197" text-anchor="middle">CRUD de análises</text>
  <rect class="d" x="700" y="105" rx="30" width="160" height="80"/><text class="t" x="780" y="153" text-anchor="middle">risk.db</text>
  <line class="l" x1="245" y1="145" x2="345" y2="145"/><text class="s" x="295" y="132" text-anchor="middle">REST</text><line class="l" x1="595" y1="145" x2="700" y2="145"/>
</svg>

